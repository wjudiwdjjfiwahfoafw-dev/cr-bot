[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-royale-mk-zap-bait-bot"
version = "2.3.0"
description = "Clash Royale tactical bot that plays on real Android devices over ADB (scrcpy capture + verified touch injection)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "av>=10.0.0",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.1.0",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["cr_bot*"]

[tool.setuptools.package-data]
# The scrcpy server jar is pushed to the device at startup; it must ship with the package.
"cr_bot" = ["third_party/*.jar"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
