# Clash Royale Tactical Bot Configuration
# Tailored for Mega Knight + Miner + Skeleton Barrel Zap Bait (3.3 Avg Elixir)
#
# Tuned for real Android hardware over ADB. Everything below the "deck" section is
# about making the bot see and touch the game correctly on YOUR device.

deck:
  - mega_knight       # 7 elixir - Defensive stomp & counterpush tank (never cycle dry in 1x!)
  - miner             # 3 elixir - Anti-Tornado chip, Skelly Barrel tank-swap, support sniper
  - inferno_dragon    # 4 elixir - Melts P.E.K.K.A, Golem, Giant, RG, Lava Hound + baits Zap
  - skeleton_barrel   # 3 elixir - Primary Zap-bait win condition + death damage
  - zap               # 2 elixir - Resets Inferno/Sparky, clears swarms, retargets tower onto Miner
  - bats              # 2 elixir - High-DPS air defense + lethal counterpush behind Miner/MK
  - spear_goblins     # 2 elixir - Split cycle, bridge chip, center-pull kiting vs melee killers
  - goblin_gang       # 3 elixir ("goblin army") - Ground swarm defense, Prince/Hog surround, bait
                      # Tip: If you run Skeleton Army instead of Goblin Gang, change to `skeleton_army`

evolutions:
  - mega_knight
  - bats

loop_hz: 15.0
auto_queue_battle: false   # Set true to automatically click Battle & OK between matches

adb:
  adb_path: "adb"
  serial: null             # Auto-discovers USB devices and BlueStacks/LDPlayer/MEmu/MuMu
  target_height: 1280      # Only used as a fallback; real geometry comes from calibration
  human_jitter_px: 2       # Subtle Gaussian pixel randomization on touches
  keep_screen_on: true     # Wakes the device and keeps the display awake
  lock_portrait: true      # Pins natural (portrait) orientation so touch maths stays valid
  latency_sec: 0.10        # Round-trip latency the brain compensates for

# ---------------------------------------------------------------------------------------
# Capture: a live H.264 stream instead of `adb exec-out screencap`.
# `screencap` costs 150-400 ms per frame on a real phone (~1 fps), which makes the bot
# permanently react to stale information. A streamed backend costs ~2-30 ms and is current.
# ---------------------------------------------------------------------------------------
capture:
  # Capture ladder: screenrecord -> scrcpy_py -> screencap (first one that delivers frames wins).
  #   screenrecord  Android's own binary, 25-30 fps, no server jar, nothing version-specific
  #   scrcpy_py     the `scrcpy` PyPI package, if installed (it pushes its own server jar)
  #   screencap     always works, ~1 fps on a 1080p phone
  # No scrcpy server jar ships with this repo. Use "auto" unless you are debugging a backend.
  backend: "auto"          # auto | screenrecord | scrcpy_py | screencap
  width: 720               # Streamed width; 720 is plenty for vision and much faster
  bitrate: 12000000
  max_fps: 30

# ---------------------------------------------------------------------------------------
# Input: how a card actually gets placed.
# `drag` performs the game's native gesture (press card -> glide -> release) rather than
# two zero-duration taps, which the game frequently ignores.
# ---------------------------------------------------------------------------------------
input:
  backend: "auto"          # auto -> swipe first, then the more literal adb fallbacks
  chain: ["swipe", "motionevent", "tap"]
  deploy_style: "tap"      # tap = select card, then tap the tile (no drag)
  verify_threshold: 9.0    # Pixel-diff (0-255) that counts as "the card left the hand"

# ---------------------------------------------------------------------------------------
# Calibration: measured once per device, then reused.
# The bot auto-detects river / hand cards / elixir bar / towers and saves the result here.
# Check configs/calibration/<device>.preview.png to confirm the grid lines up, or run
#   python scripts/calibrate_device.py --manual
# to click the four Princess Towers yourself (exact, ~10 seconds).
# ---------------------------------------------------------------------------------------
calibration:
  dir: "configs/calibration"

# Which builds of the game count as "the game". Custom APKs / private servers (Nulls Royale,
# modded clients) are the same game with a different application id - list them here, or pass
# `--package <id>` on the command line. `package_hints` match any substring of the id, so a
# re-signed build is picked up without knowing its exact name.
game:
  packages:
    - "com.supercell.clashroyale"     # stock app
    - "nullsroyale.rel.free"          # Nulls Royale
  package_hints:
    - "clashroyale"
    - "clash_royale"
    - "nullsroyale"

vision:
  templates_dir: "assets/card_templates"
  yolo_weights_path: "weights/clash_yolov8n.onnx"   # Optional; auto-falls back to OpenCV
  yolo_confidence: 0.42
  enable_opencv_fallback: true
  unit_recognition: true    # Conservative sprite naming; false keeps all CV troops generic
  identity_learning: false # Experimental: opt in to heuristic, persistent deployment samples

tactics:
  tower_level: 11
  min_action_cooldown_sec: 0.65
  mk_min_stomp_elixir_value: 4.0   # Minimum ground cluster threat before committing Mega Knight
  leak_prevention_elixir: 9.3      # Proactive cycle/chip threshold so we never leak elixir
  bait_window_seconds: 11.0        # Aggressive swarm/barrel window after opponent spends Log/Zap
  overtime_spell_finish_hp: 380    # Aggressive Miner + Zap finish threshold on low-HP towers
